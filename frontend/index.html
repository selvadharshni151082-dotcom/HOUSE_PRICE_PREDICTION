<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>

    <div class="container">

        <h1>House Price Prediction</h1>

        <p>Enter the house details</p>


        <form id="predictionForm">

            <label for="area">
                Area (sq.ft)
            </label>

            <input
                type="number"
                id="area"
                placeholder="Example: 1500"
                required
            >


            <label for="bedrooms">
                Number of Bedrooms
            </label>

            <input
                type="number"
                id="bedrooms"
                placeholder="Example: 3"
                required
            >


            <label for="bathrooms">
                Number of Bathrooms
            </label>

            <input
                type="number"
                id="bathrooms"
                placeholder="Example: 2"
                required
            >


            <label for="stories">
                Number of Stories
            </label>

            <input
                type="number"
                id="stories"
                placeholder="Example: 2"
                required
            >


            <label for="parking">
                Number of Parking Spaces
            </label>

            <input
                type="number"
                id="parking"
                placeholder="Example: 1"
                required
            >


            <button type="submit">
                Predict House Price
            </button>

        </form>


        <div id="result">

            <h2>Predicted Price</h2>

            <p id="price">
                ₹ 0
            </p>

        </div>

    </div>


    <script src="/static/scripts.js"></script>

</body>

</html>
